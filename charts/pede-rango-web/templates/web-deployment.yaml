apiVersion: apps/v1
kind: Deployment
metadata:
  name: pede-rango-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: pede-rango-web
  template:
    metadata:
      labels:
        app: pede-rango-web
    spec:
      containers:
      - name: web
        image: "{{ .Values.web.image }}:{{ .Values.web.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.web.port }}
        # Configuração de consumo de recursos da aplicação
        resources:
          requests:
            cpu: {{ .Values.web.resources.requests.cpu | quote }}
            memory: {{ .Values.web.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.web.resources.limits.cpu | quote }}
            memory: {{ .Values.web.resources.limits.memory | quote }}
        # Aqui temos Probes configurados também para a aplicação WEB
        # permitindo a verificação da aplicação
        readinessProbe:
          httpGet:
            path: {{ .Values.web.probes.readiness.path }}
            port: {{ .Values.web.port }}
          initialDelaySeconds: {{ .Values.web.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: {{ .Values.web.probes.liveness.path }}
            port: {{ .Values.web.port }}
          initialDelaySeconds: {{ .Values.web.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
          timeoutSeconds: 2
          failureThreshold: 3
